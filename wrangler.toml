# מילה — Cloudflare Workers + Static Assets + D1
# ברירת המחדל (ללא --env) היא סביבת הבדיקות. ייצור: --env production.

name = "mila-staging"
main = "src/index.js"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
# משתנים וסודות שהוגדרו בלוח הבקרה של Cloudflare נשמרים בפריסה (לא נמחקים).
# סודות (כמו GOOGLE_CLIENT_SECRET) לעולם לא נכתבים בקובץ הזה.
keep_vars = true

# הקבצים הסטטיים מוטמעים ב-Worker (scripts/embed-assets.mjs). ראו README על Static Assets.

[observability]
enabled = true

# תזכורות התראה: בדיקה כל 5 דקות (בחינמי: עד 5 Cron לחשבון, 288 הרצות ביום)
[triggers]
crons = ["*/5 * * * *"]

[vars]
APP_ENV = "staging"
PUBLIC_URL = "https://mila-staging.mila-app.workers.dev"
ADMIN_EMAIL_SHA256 = "c328ef66ffdd31f35e915b99b7de137312489f49be34cd6d2dbf4e9947f18fbb"  # מנהלת המערכת: SHA-256 של האימייל (לא האימייל עצמו). רואה את פאנל הניהול.
ALLOW_TEST_LOGIN = "true"          # כניסת בדיקה (ללא גוגל) — רק בסביבת הבדיקות
GOOGLE_CLIENT_ID = "254071228810-r6ap3ke8gkt6l4tkkkp4ghk27gd08v9f.apps.googleusercontent.com"              # מזהה הלקוח של Google OAuth (ציבורי). הסוד נשמר כ-secret: wrangler secret put GOOGLE_CLIENT_SECRET

[[d1_databases]]
binding = "DB"
database_name = "mila-db"
database_id = "da20c770-cfac-47a2-abd7-b7e15fde46a9"
migrations_dir = "migrations"

# ---------- ייצור ----------

# הגבלת קצב (חינמי, בלי כתיבות למסד): נתיבים פתוחים לפי כתובת IP, פעולות לפי משתמשת
[[ratelimits]]
name = "RL_PUBLIC"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_USER"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

[env.production]
name = "mila"
workers_dev = true


[env.production.observability]
enabled = true

[env.production.triggers]
crons = ["*/5 * * * *"]

[env.production.vars]
APP_ENV = "production"
PUBLIC_URL = "https://mila.mila-app.workers.dev"
ADMIN_EMAIL_SHA256 = "c328ef66ffdd31f35e915b99b7de137312489f49be34cd6d2dbf4e9947f18fbb"  # מנהלת המערכת: SHA-256 של האימייל (לא האימייל עצמו). רואה את פאנל הניהול.
ALLOW_TEST_LOGIN = "false"
GOOGLE_CLIENT_ID = "254071228810-r6ap3ke8gkt6l4tkkkp4ghk27gd08v9f.apps.googleusercontent.com"

[[env.production.d1_databases]]
binding = "DB"
database_name = "mila-db-prod"
database_id = "8bacb983-b3e6-4bbd-89ac-2b2bc80fbfa2"
migrations_dir = "migrations"

# הגבלת קצב (חינמי, בלי כתיבות למסד): נתיבים פתוחים לפי כתובת IP, פעולות לפי משתמשת
[[env.production.ratelimits]]
name = "RL_PUBLIC"
namespace_id = "2001"
simple = { limit = 30, period = 60 }

[[env.production.ratelimits]]
name = "RL_USER"
namespace_id = "2002"
simple = { limit = 120, period = 60 }
