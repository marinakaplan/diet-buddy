# מילה — Cloudflare Workers + Static Assets + D1
# ברירת המחדל (ללא --env) היא סביבת הבדיקות. ייצור: --env production.

name = "mila-staging"
main = "src/index.js"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# הקבצים הסטטיים מוטמעים ב-Worker (scripts/embed-assets.mjs). ראו README על Static Assets.

[observability]
enabled = true

[vars]
APP_ENV = "staging"
ALLOW_TEST_LOGIN = "true"          # כניסת בדיקה (ללא גוגל) — רק בסביבת הבדיקות
GOOGLE_CLIENT_ID = ""              # מזהה הלקוח של Google OAuth (ציבורי). הסוד נשמר כ-secret: wrangler secret put GOOGLE_CLIENT_SECRET

[[d1_databases]]
binding = "DB"
database_name = "mila-db"
database_id = "da20c770-cfac-47a2-abd7-b7e15fde46a9"
migrations_dir = "migrations"

# ---------- ייצור ----------
[env.production]
name = "mila"
workers_dev = true


[env.production.observability]
enabled = true

[env.production.vars]
APP_ENV = "production"
ALLOW_TEST_LOGIN = "false"
GOOGLE_CLIENT_ID = ""

[[env.production.d1_databases]]
binding = "DB"
database_name = "mila-db-prod"
database_id = "8bacb983-b3e6-4bbd-89ac-2b2bc80fbfa2"
migrations_dir = "migrations"
