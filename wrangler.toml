# מילה — Cloudflare Workers + Static Assets + D1
# ברירת המחדל (ללא --env) היא סביבת הבדיקות. ייצור: --env production.

name = "mila-staging"
main = "src/index.js"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[vars]
APP_ENV = "staging"
ALLOW_TEST_LOGIN = "true"          # כניסת בדיקה (ללא גוגל) — רק בסביבת הבדיקות
GOOGLE_CLIENT_ID = ""              # מזהה הלקוח של Google OAuth (ציבורי). הסוד נשמר כ-secret: wrangler secret put GOOGLE_CLIENT_SECRET

[[d1_databases]]
binding = "DB"
database_name = "mila-db"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "migrations"

# ---------- ייצור ----------
[env.production]
name = "mila"
workers_dev = true

[env.production.assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[env.production.observability]
enabled = true

[env.production.vars]
APP_ENV = "production"
ALLOW_TEST_LOGIN = "false"
GOOGLE_CLIENT_ID = ""

[[env.production.d1_databases]]
binding = "DB"
database_name = "mila-db-prod"
database_id = "00000000-0000-0000-0000-000000000002"
migrations_dir = "migrations"
